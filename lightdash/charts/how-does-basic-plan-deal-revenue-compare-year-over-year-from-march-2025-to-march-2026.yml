description: >-
  Compares monthly total deal amounts for Basic plan deals against the same
  months from the previous year to identify revenue trends and growth patterns.
metricQuery:
  additionalMetrics:
    - baseMetricId: deals_total_amount
      description: The sum of deal amount for selected deals
      generationType: periodOverPeriod
      granularity: YEAR
      hidden: true
      label: Total amount (Previous year)
      name: total_amount__pop__year_1__1lqyg0
      periodOffset: 1
      sql: ${TABLE}.amount
      table: deals
      timeDimensionId: deals_created_date_month
      type: sum
      uuid: 5fc065e5-9f62-4482-959d-eda638bbf30e
  customDimensions: []
  dimensionOverrides: {}
  dimensions:
    - deals_created_date_month
  exploreName: deals
  filters:
    dimensions:
      and:
        - id: 9089554d-1f07-485d-8e20-34ff5964c7a1
          operator: equals
          target:
            fieldId: deals_plan
          values:
            - Basic
        - id: metrics-explore-date-filter
          operator: inBetween
          target:
            fieldId: deals_created_date_month
          values:
            - "2025-03-01"
            - "2026-03-16"
      id: metrics-explore-dimensions-filters
  limit: 5000
  metricOverrides: {}
  metrics:
    - deals_total_amount
    - deals_total_amount__pop__year_1__1lqyg0
  sorts: []
  tableCalculations: []
