chartConfig:
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: deals_created_date_month
            yRef:
              field: deals_total_amount
          name: Total amount
          type: line
        - encode:
            xRef:
              field: deals_created_date_month
            yRef:
