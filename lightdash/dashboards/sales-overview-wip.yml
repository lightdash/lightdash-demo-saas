      content: >-
        This dashboard gives a sweet snapshot of how our sales are growing —
        from pipeline potential to monthly wins. It’s designed to help the team
        track momentum and spot where our next burst of growth might bloom.


        - **📦 Pipeline Value** — the total potential revenue waiting to ripen.

        <br />


        - **🍑 Closed Won Value** — what’s officially landed in our basket.

        <br />


        - **🌈 Trends Over Time** — watch how our deal flow and growth stack up
        month by month.



        Use this view to celebrate wins, nurture opportunities, and keep the
        momentum juicy.

        <br />

        If something feels off (or extra sweet 🍬),tag the team in
        [#data-collab!](https://lightdash.slack.com/archives/C02FSS5HL2E)
      hideFrame: false
      title: 🍇 Plumly Sales Overview
