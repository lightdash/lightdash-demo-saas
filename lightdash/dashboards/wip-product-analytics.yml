tiles:
  - h: 6
    properties:
      content: >-


        ---

        This dashboard shows how Plumly’s users are engaging day by day —
        helping you spot bursts of activity and steady growth across the
        platform.


        **📊 Event Volume** — total daily interactions happening across Plumly.

        <br />


        **👥 User Activity** — average actions per unique user (because every
        click counts!).

        <br />


        **🍇 Engagement Flow** — a waterfall view showing daily shifts in active
        logins and energy levels.


        ---


        If something looks unusually sweet (or a little sour 🍋),drop a note in
        [#data-collab!](https://lightdash.slack.com/archives/C02FSS5HL2E) so the
        team can take a closer look!
      hideFrame: false
      title: 🍑 Plumly Daily Engagement Dashboard
    tabSlug: null
    type: markdown
